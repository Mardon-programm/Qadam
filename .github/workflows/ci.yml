name: Qadam CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: qadam_test
          POSTGRES_USER: qadam
          POSTGRES_PASSWORD: qadam_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qadam -d qadam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app

      - name: Ruff format check
        run: ruff format --check app

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://qadam:qadam_test_password@localhost:5432/qadam_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-at-least-32-chars
          APP_ENV: test
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://qadam:qadam_test_password@localhost:5432/qadam_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-at-least-32-chars
          APP_ENV: test
          PAYMENT_PROVIDER: mock
        run: pytest -x -q
