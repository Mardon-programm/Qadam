groups:
  - name: qadam_api_alerts
    interval: 30s
    rules:
      - alert: APIHighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate detected"
          description: "API error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: APIHighLatency
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API latency is high"
          description: "95th percentile latency is {{ $value }}s"

      - alert: APIDown
        expr: up{job="qadam-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Qadam API is down"
          description: "API instance {{ $labels.instance }} has been down for more than 1 minute"

  - name: database_alerts
    interval: 30s
    rules:
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database has been down for more than 1 minute"

      - alert: DatabaseConnectionsHigh
        expr: |
          pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connections near limit"
          description: "Database is using {{ $value | humanizePercentage }} of max connections"

      - alert: DatabaseDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql/data"} / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql/data"}) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Database disk space is low"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"

  - name: redis_alerts
    interval: 30s
    rules:
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis cache has been down for more than 1 minute"

      - alert: RedisMemoryHigh
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis is using {{ $value | humanizePercentage }} of max memory"

  - name: business_alerts
    interval: 1m
    rules:
      - alert: NoRidesCreated
        expr: |
          rate(rides_created_total[10m]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No rides created recently"
          description: "No new rides have been created in the last 30 minutes"

      - alert: HighRideCancellationRate
        expr: |
          rate(rides_cancelled_total[10m]) / rate(rides_created_total[10m]) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High ride cancellation rate"
          description: "Cancellation rate is {{ $value | humanizePercentage }}"

      - alert: NoDriversOnline
        expr: drivers_online_total == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No drivers online"
          description: "There are currently no drivers online in the system"

      - alert: PaymentFailureRateHigh
        expr: |
          rate(payment_failures_total[10m]) / rate(payment_attempts_total[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High payment failure rate"
          description: "Payment failure rate is {{ $value | humanizePercentage }}"
