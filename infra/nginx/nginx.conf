worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Hide server version
    server_tokens off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m  rate=5r/m;

    upstream qadam_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Redirect HTTP → HTTPS in production; for dev allow plain HTTP
        # return 301 https://$host$request_uri;

        location /health {
            proxy_pass http://qadam_api;
            proxy_set_header Host $host;
            access_log off;
        }

        # Auth endpoints — stricter rate limit
        location ~ ^/api/v1/auth/otp {
            limit_req zone=api_auth burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://qadam_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # General API
        location /api/ {
            limit_req zone=api_general burst=60 nodelay;
            limit_req_status 429;

            proxy_pass http://qadam_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Security headers
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
            add_header X-XSS-Protection "1; mode=block";
            add_header Referrer-Policy strict-origin-when-cross-origin;
        }

        # Docs (dev only — remove in production)
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://qadam_api;
            proxy_set_header Host $host;
        }
    }
}
